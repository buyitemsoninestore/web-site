<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BuyItemsOnline.lk</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="auth-page">
    <div class="auth-glow glow-1"></div>
    <div class="auth-glow glow-2"></div>

    <div class="auth-container">
        <div class="auth-header">
            <a href="index.html" class="auth-logo">B<span>.lk</span></a>
            <h1>Welcome Back</h1>
            <p>Enter your details to access your dashboard</p>
        </div>

        <div class="social-login">
            <button class="social-btn">
                <img src="https://www.google.com/favicon.ico" width="18" height="18" alt="Google">
                Google
            </button>
        </div>

        <div class="divider">or continue with email</div>

        <form class="auth-form" id="login-form">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" class="auth-input" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <div style="display: flex; justify-content: space-between;">
                    <label>Password</label>
                    <a href="forgot-password.html"
                        style="font-size: 0.8rem; color: #FF0000; text-decoration: none;">Forgot?</a>
                </div>
                <input type="password" class="auth-input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="auth-btn">Sign In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="register.html">Create one</a>
        </div>
    </div>

    <script src="auth.js"></script>
</body>

</html>
