<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - BuyItemsOnline.lk</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> <!-- Reusing main styles for dashboard -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .dashboard-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
            background: #050505;
        }

        .sidebar {
            background: #0A0A0A;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 30px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary-red);
            text-decoration: none;
            margin-bottom: 50px;
        }

        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .nav-link:hover,
        .nav-link.active {
            background: rgba(255, 0, 0, 0.1);
            color: white;
        }

        .main-content {
            padding: 40px;
            overflow-y: auto;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .user-welcome h1 {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .user-welcome p {
            color: var(--text-secondary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .dashboard-card {
            background: #0F0F0F;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 20px;
        }

        .data-table-container {
            background: #0F0F0F;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            text-align: left;
            padding: 18px 25px;
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .data-table td {
            padding: 20px 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 0.95rem;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .badge-success {
            background: rgba(0, 255, 0, 0.1);
            color: #00FF00;
        }

        .badge-pending {
            background: rgba(255, 165, 0, 0.1);
            color: orange;
        }

        .key-box {
            background: rgba(255, 0, 0, 0.1);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-family: monospace;
            border: 1px dashed rgba(255, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .copy-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.3s;
        }

        .copy-btn:hover {
            color: white;
        }

        @media (max-width: 900px) {
            .dashboard-layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: none;
            }

            /* Mobile nav should handle this later */
        }
    </style>
</head>

<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a href="index.html" class="sidebar-logo">BuyItems<span>.lk</span></a>
            <ul class="nav-menu">
                <li><a href="#" class="nav-link active">🏠 Overview</a></li>
                <li><a href="#" class="nav-link">🛍️ My Orders</a></li>
                <li><a href="#" class="nav-link">💳 Subscriptions</a></li>
                <li><a href="#" class="nav-link">⚙️ Settings</a></li>
            </ul>

            <div style="margin-top: auto;">
                <button id="logout-btn" class="nav-link"
                    style="width: 100%; cursor: pointer; border: none; background: none;">🚪 Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="dashboard-header">
                <div class="user-welcome">
                    <h1 id="user-display-name">Hi, User!</h1>
                    <p>Welcome back to your premium dashboard.</p>
                </div>
            </header>

            <div class="stats-grid">
                <div class="dashboard-card">
                    <p style="color: grey; font-size: 0.9rem;">Total Spent</p>
                    <h2 style="font-size: 2.2rem; margin-top: 10px;">Rs. 0</h2>
                </div>
                <div class="dashboard-card">
                    <p style="color: grey; font-size: 0.9rem;">Active Plans</p>
                    <h2 style="font-size: 2.2rem; margin-top: 10px;">0</h2>
                </div>
            </div>

            <section>
                <h3 style="margin-bottom: 20px;">Recent Purchases</h3>
                <div class="data-table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th>Activation Key</th>
                            </tr>
                        </thead>
                        <tbody id="orders-tbody">
                            <!-- Orders will be loaded here -->
                            <tr>
                                <td colspan="4" style="text-align: center; color: grey; padding: 40px;">No purchases
                                    found yet.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script>
        // Placeholder for Dashboard Logic (to be linked to Supabase)
        const logoutBtn = document.getElementById('logout-btn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', () => {
                alert('Logging out...');
                window.location.href = 'login.html';
            });
        }
    </script>
</body>

</html>
