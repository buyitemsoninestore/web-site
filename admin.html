<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - BuyItems.lk</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
            background: #030303;
        }

        .sidebar {
            background: #080808;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 30px;
        }

        .main-content {
            padding: 40px;
        }

        .admin-nav {
            list-style: none;
            margin-top: 40px;
        }

        .admin-nav li {
            margin-bottom: 8px;
        }

        .admin-nav a {
            display: block;
            padding: 12px 20px;
            color: #AAA;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.3s;
        }

        .admin-nav a.active {
            background: #FF0000;
            color: white;
        }

        .form-card {
            background: #0F0F0F;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 40px;
        }

        .admin-input {
            width: 100%;
            background: #1A1A1A;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 8px;
            color: white;
            margin-bottom: 15px;
        }

        .btn-add {
            background: #008000;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <h2 style="color: #FF0000;">Admin Central</h2>
            <ul class="admin-nav">
                <li><a href="#" class="active">📊 Analytics</a></li>
                <li><a href="#">📦 Products</a></li>
                <li><a href="#">🔑 Key Vault</a></li>
                <li><a href="#">👥 Users</a></li>
                <li><a href="#">🛡️ Security</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <h1>Product Management</h1>
            <div class="form-card">
                <h3>Add New Product</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
                    <input type="text" class="admin-input" placeholder="Product Name (e.g. YouTube Premium 3 Months)">
                    <input type="number" class="admin-input" placeholder="Price (Rs.)">
                    <select class="admin-input">
                        <option>Choose Category</option>
                        <option>YouTube</option>
                        <option>Netflix</option>
                        <option>Spotify</option>
                    </select>
                    <input type="file" class="admin-input">
                </div>
                <textarea class="admin-input" style="height: 100px;" placeholder="Product Description"></textarea>
                <button class="btn-add">Save Product</button>
            </div>

            <div class="form-card" style="background: rgba(255, 0, 0, 0.05); border: 1px dashed rgba(255, 0, 0, 0.2);">
                <h3>Bulk Key Upload</h3>
                <p style="color: grey; margin: 10px 0;">Upload a CSV file or paste keys here (one per line)</p>
                <textarea class="admin-input" style="height: 150px; font-family: monospace;" placeholder="ABCD-1234-EFGH
IJKL-5678-MNOP"></textarea>
                <button class="btn-add" style="background: #CC0000;">Upload to Inventory</button>
            </div>
        </main>
    </div>
</body>

</html>
